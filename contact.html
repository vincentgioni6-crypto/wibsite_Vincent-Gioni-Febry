<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173c84">
    <meta name="description" content="Hubungi Vincent Gioni Febry Alfaro melalui formulir kontak.">
    <title>Contact — Vincent Gioni Febry Alfaro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="Navigasi utama">
            <a class="brand" href="index.html">Vincent Gioni Febry Alfaro</a>
            <div class="nav-links">
                <a href="index.html">Beranda</a>
                <a href="about.html">Tentang</a>
                <a href="cv-vincent.pdf" target="_blank" rel="noopener">CV</a>
                <a href="contact.html" aria-current="page">Kontak</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="page-card">
            <p class="eyebrow">Kontak</p>
            <h1>Kirim pesan.</h1>
            <p class="page-intro">Isi formulir di bawah ini untuk menghubungi saya.</p>

            <div class="contact-layout">
                <aside class="contact-aside">
                    <h2>Halo!</h2>
                    <p>Saya senang mendapat pesan. Silakan tulis pesan dan alamat email Anda di sini.</p>
                </aside>
                <form class="contact-form" action="#" method="get">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="nama@email.com" autocomplete="email" required>

                    <label for="message">Pesan</label>
                    <textarea name="message" id="message" placeholder="Tulis pesan Anda..." required></textarea>

                    <button class="button" type="submit">Kirim pesan</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 Vincent Gioni Febry Alfaro</p>
    </footer>
</body>
</html>
